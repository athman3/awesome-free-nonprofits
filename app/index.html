        <style>
            /* Keep filtered deep links blank until their original client view is ready. */
            html[data-client-filtered] #root[data-prerendered] {
                visibility: hidden;
            }

            /* Force dark background immediately if dark mode is active */
            /* This prevents flash of white content before React loads */
            html.dark,
            html.dark body {
                background-color: hsl(222.2, 84%, 4.9%) !important;
                color: hsl(210, 40%, 98%) !important;
            }
        </style>
        <script>
            // The static homepage must not flash before a filtered client render.
            const filterParams = new URLSearchParams(window.location.search);
            if (filterParams.get("q") ||
                (filterParams.get("category") && filterParams.get("category") !== "all")) {
                document.documentElement.setAttribute("data-client-filtered", "");
            }

            // Apply theme immediately to prevent flash of white content (FOUC)
            // This script runs synchronously before React renders
            (function () {
                const storageKey = "awesome-nonprofits-theme";
                const defaultTheme = "system";

                const getThemePreference = () => {
                    if (
                        typeof localStorage !== "undefined" &&
                        localStorage.getItem(storageKey)
                    ) {
                        return localStorage.getItem(storageKey);
                    }
                    return defaultTheme;
                };

                const storedTheme = getThemePreference();
                let theme = storedTheme;

                if (theme === "system") {
                    const systemTheme = window.matchMedia(
                        "(prefers-color-scheme: dark)"
                    ).matches
                        ? "dark"
                        : "light";
                    theme = systemTheme;
                }

                const isDark = theme === "dark";
                document.documentElement.classList[isDark ? "add" : "remove"](
                    "dark"
                );
            })();
        </script>
